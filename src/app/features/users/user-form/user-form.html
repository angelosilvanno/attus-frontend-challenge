<h2 mat-dialog-title>{{ data ? 'Editar usuário' : 'Adicionar novo usuário' }}</h2>

<mat-dialog-content [formGroup]="userForm">
  <div class="form-container">
    <mat-form-field appearance="outline">
      <mat-label>Nome completo *</mat-label>
      <input matInput formControlName="nome" placeholder="Ex: João Silva">
      <mat-error *ngIf="userForm.get('nome')?.hasError('required')">Nome é obrigatório</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>E-mail *</mat-label>
      <input matInput formControlName="email" placeholder="email@exemplo.com">
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">E-mail é obrigatório</mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">E-mail inválido</mat-error>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>CPF *</mat-label>
        <input matInput formControlName="cpf" placeholder="000.000.000-00">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Número do telefone *</mat-label>
        <input matInput formControlName="telefone" placeholder="(00) 00000-0000">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo de telefone</mat-label>
        <mat-select formControlName="tipoTelefone">
          <mat-option value="Celular">Celular</mat-option>
          <mat-option value="Fixo">Fixo</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">CANCELAR</button>
  <button mat-raised-button color="primary" 
          [disabled]="userForm.invalid" 
          (click)="onSave()">SALVAR</button>
</mat-dialog-actions>
